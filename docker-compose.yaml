version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: photogrammetry_redis
    ports:
      - "6379:6379"

  web_api:
    build: .
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    depends_on:
      - redis

  celery_worker:
    build: .
    command: celery -A tasks.celery_app worker --loglevel=info
    depends_on:
      - redis